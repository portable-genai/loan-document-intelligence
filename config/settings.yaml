# Loan / Mortgage Document Intelligence (B5) : runtime configuration.
#
# Three deployment profiles, selected by LOAN_DOC_PROFILE (or profile: below):
#   local  : a WORKING offline laptop stack (local document parser + deterministic LLM,
#            append-only SQLite audit, SDK-free, no API key, no emulator). Default when
#            LOAN_DOC_PROFILE is unset (dev / test / CI).
#   gcp    : Google Cloud managed services (lazy SDK imports). Production sets
#            LOAN_DOC_PROFILE=gcp explicitly.
#   onprem : fail-fast Google Distributed Cloud migration placeholders.
# Nothing in src/loan_doc_intel/domain changes between profiles.
#
# The profile below deliberately has NO literal fallback. An unset LOAN_DOC_PROFILE and an
# unset profile: key together mean "nobody chose", which is a third state: the SDK-free local
# adapters still bind (nothing else can, with no cloud SDK installed) but every relaxation is
# refused, so the seeded no-auth personas and the localhost CORS origins are NOT served.
# Write a profile here, or set LOAN_DOC_PROFILE, to consent to one deliberately.

project_id: ${GOOGLE_CLOUD_PROJECT:-your-gcp-project}
region: asia-southeast1            # Singapore : applicant PII data residency
profile: ${LOAN_DOC_PROFILE:-}         # local | gcp | platform | onprem
kms_key: ${LOAN_DOC_KMS_KEY:-}         # regional Cloud KMS key for CMEK

models:
  # `location` is the Vertex location the model client calls, and it is DELIBERATELY NOT
  # `region`. The client was built with the compute region until 2026-08-27, which capped every
  # deployment at what its own region serves: us-central1 serves the 2.5 family and no Gemini 3,
  # so the ids pinned below could never resolve there. gemini-3.1-pro, previously the
  # hard-reasoning pin, resolves in NO location at all.
  #
  # Gemini 3.7 serves the `us` and `eu` MULTI-REGIONS only -- not `asia`, and not any single
  # region. A multi-region endpoint pools capacity within one geography and Google documents ML
  # processing as staying inside it, where `global` carries NO residency guarantee. So `us` here
  # is a residency-preserving choice, an EU deployment sets `eu`, and an APAC deployment cannot
  # have both Gemini 3 and in-region processing: it must either pin a 2.5 model its own region
  # serves or accept `global` and say so. Do not quietly set `global`.
  location: ${LOAN_DOC_MODEL_LOCATION:-us}
  reasoning: gemini-3.7-flash          # GA : income normalisation + explanation (thinking=high)
  triage: gemini-3.1-flash-lite        # GA : routing / doc-type triage
  hard_reasoning: gemini-3.7-flash  # no Gemini 3 PRO tier serves us or eu
  use_hard_reasoning: false

document_ai:
  location: asia-southeast1
  processor_id: ${LOAN_DOC_DOCAI_PROCESSOR:-}
  processor_version: rc

model_armor:
  template_id: loan-doc-guardrail
  host: modelarmor.asia-southeast1.rep.googleapis.com

dlp:
  inspect_template: ${LOAN_DOC_DLP_INSPECT_TEMPLATE:-}
  deidentify_template: ${LOAN_DOC_DLP_DEIDENTIFY_TEMPLATE:-}

pii:
  jurisdictions: ${LOAN_DOC_PII_JURISDICTIONS:-SG,HK,JP,AU}

logging:
  log_name: loan-document-intelligence-audit
  bucket: loan-document-intelligence-worm
  retention_days: 2557               # ~7 years; bucket is locked (irreversible) in prod

agent_engine:
  resource_name: ${LOAN_DOC_AGENT_ENGINE:-}
  display_name: loan-document-intelligence

validation:
  amount_tolerance: 0.05             # relative tolerance for monetary equality checks
  balance_decline_warn_ratio: 0.15
  balance_decline_fail_ratio: 0.40
  affordability_warn_ratio: 0.55
  affordability_fail_ratio: 0.70

# SDK-free 'local' profile store. Empty => per-package default under ~/.loan_doc_intel/ ;
# tests pass ':memory:' for an ephemeral, deterministic append-only audit store.
local:
  audit_path: ${LOAN_DOC_LOCAL_AUDIT:-}    # append-only local audit store

# ----------------------------------------------------------------------------- #
# Port -> adapter bindings. The container picks the entry for the active profile,
# falling back to the 'gcp' entry. These dotted paths are the build contract:
# each adapter class takes a single Settings argument. Under 'local', the
# platform-client ports (guardrail, redaction, audit, registry) use IN-PROCESS local
# implementations, not HTTP to siblings (a laptop runs one app, not the whole platform).
# ----------------------------------------------------------------------------- #
adapters:
  # Identity (server-verified end-user Principal; the client-asserted actor is discarded).
  # local  : seeded dev personas (no IdP/AD/LDAP), selected by the X-Dev-Persona header.
  # gcp     : verify the Cloud IAP-injected x-goog-iap-jwt-assertion (LOAN_DOC_IAP_AUDIENCE).
  # platform: reuse the IAP verifier (auth is configured on the fronting GCP service).
  # onprem  : fail-fast placeholder for the client's own enterprise IdP (OIDC/SAML).
  identity:
    gcp: loan_doc_intel.adapters.gcp.iap_identity:IapIdentityAdapter
    platform: loan_doc_intel.adapters.gcp.iap_identity:IapIdentityAdapter
    local: loan_doc_intel.adapters.local.identity:LocalPersonaIdentityAdapter
    onprem: loan_doc_intel.adapters.onprem.identity:OnPremIdentityAdapter
  # Object-level authorization (C2). Identity resolves WHO; this resolves WHAT they may act on.
  # The application/document in the request body is client-controlled (spoofable), so its owner
  # is resolved HERE, SERVER-SIDE, keyed by object id : never taken from the body.
  # local  : a seeded in-process registry (demo/fixture object ids owned by demo-bank).
  # gcp     : the managed regional ACL store (Firestore object-ownership records).
  # platform: the shared platform entitlements/ACL service over HTTP.
  # onprem  : fail-fast placeholder for the client's own entitlement store.
  entitlements:
    gcp: loan_doc_intel.adapters.gcp.entitlements:GcpEntitlementsAdapter
    platform: loan_doc_intel.adapters.platform.remote_entitlements:RemoteEntitlementsAdapter
    local: loan_doc_intel.adapters.local.entitlements:LocalEntitlementsAdapter
    onprem: loan_doc_intel.adapters.onprem.entitlements:OnPremEntitlementsAdapter
  extraction:
    gcp: loan_doc_intel.adapters.gcp.document_ai_extraction:DocumentAiExtractionAdapter
    platform: loan_doc_intel.adapters.gcp.document_ai_extraction:DocumentAiExtractionAdapter
    local: loan_doc_intel.adapters.local.extraction:LocalExtractionAdapter
    onprem: loan_doc_intel.adapters.onprem.extraction:OnPremExtractionAdapter
  llm:
    gcp: loan_doc_intel.adapters.gcp.gemini_llm:GeminiLLMAdapter
    platform: loan_doc_intel.adapters.gcp.gemini_llm:GeminiLLMAdapter
    local: loan_doc_intel.adapters.local.llm:LocalDeterministicLLMAdapter
    onprem: loan_doc_intel.adapters.onprem.llm:OnPremLLMAdapter
  guardrail:
    gcp: loan_doc_intel.adapters.gcp.model_armor_guardrail:ModelArmorGuardrailAdapter
    local: loan_doc_intel.adapters.local.guardrail:LocalHeuristicGuardrailAdapter
    platform: loan_doc_intel.adapters.platform.remote_guardrail:RemoteGuardrailAdapter
    onprem: loan_doc_intel.adapters.onprem.guardrail:OnPremGuardrailAdapter
  redaction:
    gcp: loan_doc_intel.adapters.gcp.dlp_redaction:DlpRedactionAdapter
    local: loan_doc_intel.adapters.local.redaction:LocalRegexRedactionAdapter
    platform: loan_doc_intel.adapters.platform.remote_redaction:RemoteRedactionAdapter
    onprem: loan_doc_intel.adapters.onprem.redaction:OnPremRedactionAdapter
  agent_runtime:
    gcp: loan_doc_intel.adapters.gcp.agent_runtime:AgentRuntimeAdapter
    platform: loan_doc_intel.adapters.gcp.agent_runtime:AgentRuntimeAdapter
    local: loan_doc_intel.adapters.local.runtime:LocalAgentRuntimeAdapter
    onprem: loan_doc_intel.adapters.onprem.runtime:OnPremAgentRuntimeAdapter
  session:
    gcp: loan_doc_intel.adapters.gcp.vertex_sessions:VertexSessionsAdapter
    platform: loan_doc_intel.adapters.gcp.vertex_sessions:VertexSessionsAdapter
    local: loan_doc_intel.adapters.local.session:LocalSessionAdapter
    onprem: loan_doc_intel.adapters.onprem.session:OnPremSessionAdapter
  memory:
    gcp: loan_doc_intel.adapters.gcp.vertex_memory_bank:VertexMemoryBankAdapter
    platform: loan_doc_intel.adapters.gcp.vertex_memory_bank:VertexMemoryBankAdapter
    local: loan_doc_intel.adapters.local.memory:LocalMemoryAdapter
    onprem: loan_doc_intel.adapters.onprem.memory:OnPremMemoryAdapter
  audit:
    gcp: loan_doc_intel.adapters.gcp.cloud_logging_audit:CloudLoggingAuditAdapter
    local: loan_doc_intel.adapters.local.audit:LocalAppendOnlyAuditAdapter
    platform: loan_doc_intel.adapters.platform.remote_audit:RemoteAuditAdapter
    onprem: loan_doc_intel.adapters.onprem.audit:OnPremAuditAdapter
  tracer:
    gcp: loan_doc_intel.adapters.gcp.cloud_trace_tracer:CloudTraceTracerAdapter
    platform: loan_doc_intel.adapters.gcp.cloud_trace_tracer:CloudTraceTracerAdapter
    local: loan_doc_intel.adapters.local.tracer:LocalNoopTracerAdapter
    onprem: loan_doc_intel.adapters.onprem.tracer:OnPremTracerAdapter
  evaluation:
    gcp: loan_doc_intel.adapters.gcp.genai_eval:GenAiEvalAdapter
    local: loan_doc_intel.adapters.local.evaluation:LocalOfflineEvalAdapter
    platform: loan_doc_intel.adapters.platform.remote_evaluation:RemoteEvaluationAdapter
    onprem: loan_doc_intel.adapters.onprem.evaluation:OnPremEvalAdapter
  registry:
    gcp: loan_doc_intel.adapters.gcp.a2a_registry:A2ARegistryAdapter
    local: loan_doc_intel.adapters.local.registry:LocalRegistryAdapter
    platform: loan_doc_intel.adapters.platform.remote_registry:RemoteRegistryAdapter
    onprem: loan_doc_intel.adapters.onprem.registry:OnPremRegistryAdapter
  tool_catalog:
    gcp: loan_doc_intel.adapters.gcp.mcp_tool_catalog:McpToolCatalogAdapter
    platform: loan_doc_intel.adapters.gcp.mcp_tool_catalog:McpToolCatalogAdapter
    local: loan_doc_intel.adapters.local.tool_catalog:LocalToolCatalogAdapter
    onprem: loan_doc_intel.adapters.onprem.tool_catalog:OnPremToolCatalogAdapter
  # review_router (rule R8): route a requires_human_review escalation to the Hrz7 Human-Review
  # & Maker-Checker Console via the shared review-kit, not a per-repo boolean. local enqueues
  # to an in-memory outbox so the routing path runs offline; gcp/platform submit over S2S to Hrz7's
  # service intake; onprem is the sovereign-console migration placeholder.
  review_router:
    gcp: loan_doc_intel.adapters.platform.review_router:PlatformReviewRouter
    platform: loan_doc_intel.adapters.platform.review_router:PlatformReviewRouter
    local: loan_doc_intel.adapters.local.review_router:LocalReviewRouter
    onprem: loan_doc_intel.adapters.onprem.review_router:OnPremReviewRouter
