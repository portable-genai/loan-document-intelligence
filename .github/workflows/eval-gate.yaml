name: Eval gate

# The pre-merge eval SMOKE check, and NOT the promotion authority. Runs eval/run_eval.py
# --mode smoke over the golden cases and fails (non-zero exit) if any metric : extraction
# accuracy, validation recall, validation precision, PII safety : is below threshold. That
# is a merge decision, not a release one. The promotion VERDICT is Hrz4's, taken separately
# at release time with --mode gate, which run_eval.py refuses outside the platform or gcp
# profile and which this offline job therefore cannot produce. Workflow name kept stable
# for branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The offline eval gate runs deterministically with its own in-file driver, so the gate
  # itself needs no cloud credentials. The local profile is the SDK-free default. Switch to
  # gcp (with --use-gcp) in a protected environment to score against the live Gen AI
  # evaluation service.
  LOAN_DOC_PROFILE: local

jobs:
  eval:
    name: eval smoke check (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run eval smoke check
        # Non-zero exit fails the pre-merge check. The authoritative promotion verdict is
        # Hrz4's, taken with --mode gate outside this workflow.
        run: python eval/run_eval.py --mode smoke
