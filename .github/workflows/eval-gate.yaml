name: Eval gate

# The A4 / P-08 promotion gate. Runs eval/run_eval.py over the golden cases and fails
# (non-zero exit) if any metric : extraction accuracy, validation recall, validation
# precision, PII safety : is below threshold. A release must NOT be promoted to Agent
# Runtime unless this job is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The offline eval gate runs deterministically with its own in-file driver, so the gate
  # itself needs no cloud credentials. The local profile is the SDK-free default. Switch to
  # gcp (with --use-gcp) in a protected environment to score against the live Gen AI
  # evaluation service.
  LOAN_DOC_PROFILE: local

jobs:
  eval:
    name: Gen AI eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run eval gate
        # Non-zero exit fails the gate and blocks promotion.
        run: python eval/run_eval.py
